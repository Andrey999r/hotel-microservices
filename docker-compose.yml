networks:
  backend:
    driver: bridge
  local-kafka:
    driver: bridge

services:

  # ==================== DATA ===================

  postgres:
    image: postgres:18.3-bookworm
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "5432:5432"
    volumes:
      - ./backend/init:/docker-entrypoint-initdb.d
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6.2-alpine
    container_name: redis
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:9.3.2
    container_name: elasticsearch
    deploy:
      resources:
        limits:
          memory: 2GB
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z-cpuv1
    container_name: minio
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./backend/booking-service/src/main/resources/images/default-hotel.png:/tmp/default-hotel.png:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD};
      mc mb --ignore-existing local/${ROOMS_BUCKET};
      mc mb --ignore-existing local/${USERS_BUCKET};
      mc mb --ignore-existing local/${HOTELS_BUCKET};
      mc anonymous set public local/${ROOMS_BUCKET};
      mc anonymous set public local/${USERS_BUCKET};
      mc anonymous set public local/${HOTELS_BUCKET};
      mc stat local/${HOTELS_BUCKET}/default-hotel.png > /dev/null 2>&1 || mc cp /tmp/default-hotel.png local/${HOTELS_BUCKET}/default-hotel.png;
      echo 'MinIO initialized successfully';
      exit 0;
      "
    environment:
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    networks:
      - backend

  # ==================== METRICS ====================

  prometheus:
    image: prom/prometheus:v3
    container_name: prometheus
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ./backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana:13.0.0-24111282511-ubuntu
    container_name: grafana
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - backend

  # ==================== MESSAGING ====================

  kafka:
    image: apache/kafka:4.1.2
    container_name: broker
    deploy:
      resources:
        limits:
          memory: 1GB
    restart: on-failure:5
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_C://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://broker:29092,PLAINTEXT_C://broker:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_C:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - local-kafka

  logstash:
    image: docker.elastic.co/logstash/logstash:9.3.2
    container_name: logstash
    ports:
      - "5000:5000"
    volumes:
      - ./backend/monitoring/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx512m"
      XPACK_MONITORING_ENABLED: "false"
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - backend

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.2
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      NODE_OPTIONS: "--max-old-space-size=768"
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - backend

  # ==================== SERVICES ====================

  eureka:
    build: ./backend/service-observer
    container_name: eureka
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "8084:8084"
    environment:
      SPRING_APPLICATION_NAME: eureka
    networks:
      - backend

  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "8089:8089"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVICEURL}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - backend
      - local-kafka

  auth-service:
    build: ./backend/auth-service
    container_name: auth-service
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_APPLICATION_NAME: auth-service
      SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVICEURL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SPRING_USER_SERVICE_URL: ${USER_SERVICE_URL}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - backend
      - local-kafka

  user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: user-service
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 1GB
    environment:
      SPRING_APPLICATION_NAME: user-service
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}/${USER_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVICEURL}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_URL: ${MINIO_URL}
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_BUCKET: ${USERS_BUCKET}
      ADMIN_SECRET: ${ADMIN_SECRET}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
      - local-kafka

  booking-service:
    build:
      context: ./backend
      dockerfile: booking-service/Dockerfile
    container_name: booking-service
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_APPLICATION_NAME: booking-service
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}/${BOOKING_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVICEURL}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
      ELASTICSEARCH_URIS: ${ELASTICSEARCH_URIS}
      MINIO_URL: ${MINIO_URL}
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_BUCKET: ${ROOMS_BUCKET}
      MINIO_HOTELS_BUCKET: ${HOTELS_BUCKET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      ADMIN_ROLE: ${ADMIN_ROLE}
      USER_ROLE: ${USER_ROLE}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      kafka:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - backend
      - local-kafka

  payment-service:
    build:
      context: ./backend
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_APPLICATION_NAME: payment-service
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}/${PAYMENT_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVICEURL}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - backend
      - local-kafka

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_APPLICATION_NAME: notification-service
      SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVICEURL}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}/${NOTIFICATION_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - backend
      - local-kafka

  frontend:
    build: ./frontend
    container_name: frontend
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    networks:
      - backend

volumes:
  redis-data:
  minio-data:
  grafana-data:
  elasticsearch-data:
  kafka-data: