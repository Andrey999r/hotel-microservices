server:
  port: 8090
spring:
  application:
    name: user-service
  config:
    import: 'optional:configserver:'
  liquibase:
    change-log: classpath:db/changelog/main-changelog.xml
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
notification:
  messages:
    message: ${NOTIFICATION_MSG_REGISTRATION:Добро пожаловать! Вы успешно зарегистрировались.}
role-names:
  admin-role-name: ROLE_ADMIN
  user-role-name: ROLE_USER