spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth-api/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: apiGatewayCB
                    fallbackUri: forward:/fallback/auth-service

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/user-api/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: apiGatewayCB
                    fallbackUri: forward:/fallback/user-service

            - id: booking-service
              uri: lb://BOOKING-SERVICE
              predicates:
                - Path=/booking-api/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: apiGatewayCB
                    fallbackUri: forward:/fallback/booking-service

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payment-api/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: apiGatewayCB
                    fallbackUri: forward:/fallback/payment-service

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notification-api/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: apiGatewayCB
                    fallbackUri: forward:/fallback/notification-service

            - id: auth-service-docs
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/v3/api-docs/auth-service
              filters:
                - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

            - id: user-service-docs
              uri: lb://USER-SERVICE
              predicates:
                - Path=/v3/api-docs/user-service
              filters:
                - RewritePath=/v3/api-docs/user-service, /v3/api-docs

            - id: booking-service-docs
              uri: lb://BOOKING-SERVICE
              predicates:
                - Path=/v3/api-docs/booking-service
              filters:
                - RewritePath=/v3/api-docs/booking-service, /v3/api-docs

            - id: notification-service-docs
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/v3/api-docs/notification-service
              filters:
                - RewritePath=/v3/api-docs/notification-service, /v3/api-docs

            - id: payment-service-docs
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/v3/api-docs/payment-service
              filters:
                - RewritePath=/v3/api-docs/payment-service, /v3/api-docs

  main:
    web-application-type: reactive

server:
  port: 8089

eureka:
  client:
    service-url:
      defaultZone: ${SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8084/eureka/}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /v3/api-docs/auth-service
      - name: user-service
        url: /v3/api-docs/user-service
      - name: booking-service
        url: /v3/api-docs/booking-service
      - name: notification-service
        url: /v3/api-docs/notification-service
      - name: payment-service
        url: /v3/api-docs/payment-service
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  prometheus:
    metrics:
      export:
        enabled: true
security:
  paths:
    authenticated-paths:
      - /auth-api/auth/logout
    permit-all-paths:
      - /auth-api/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /webjars/**
      - /favicon.ico
      - /v3/api-docs
      - /v3/api-docs/**
      - /actuator/**
      - /booking-api/room/all
      - /booking-api/room/{roomId}
      - /booking-api/room/{roomId}/{photoId}
      - /booking-api/hotels/**
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
  jwt:
    expiration: ${JWT_EXPIRATION:3h}
    secret: ${JWT_SECRET:changeme}
resilience4j:
  circuitbreaker:
    instances:
      apiGatewayCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
