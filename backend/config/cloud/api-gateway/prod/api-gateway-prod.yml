spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  cloud:
    config:
        uri: http://config-server:8888
    gateway:
      rate-limiter:
        default-replenish-rate: 10
        default-burst-capacity: 20
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth-api/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: apiGatewayCB
                    fallbackUri: forward:/fallback/auth-service
                - name: Recaptcha
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    rate-limiter: "#{@redisRateLimiter}"

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/user-api/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: apiGatewayCB
                    fallbackUri: forward:/fallback/user-service
                - name: Recaptcha
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    rate-limiter: "#{@redisRateLimiter}"

            - id: booking-service
              uri: lb://BOOKING-SERVICE
              predicates:
                - Path=/booking-api/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: apiGatewayCB
                    fallbackUri: forward:/fallback/booking-service
                - name: Recaptcha
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    rate-limiter: "#{@redisRateLimiter}"

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payment-api/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: apiGatewayCB
                    fallbackUri: forward:/fallback/payment-service
                - name: Recaptcha
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    rate-limiter: "#{@redisRateLimiter}"

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notification-api/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: apiGatewayCB
                    fallbackUri: forward:/fallback/notification-service
                - name: Recaptcha
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    rate-limiter: "#{@redisRateLimiter}"


eureka:
  client:
    service-url:
      defaultZone: ${SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

recaptcha:
  secret: ${CAPTCHA_SECRET}
  url: ${CAPTCHA_URL}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

security:
  paths:
    authenticated-paths:
      - /auth-api/auth/logout
    permit-all-paths:
      - /auth-api/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /webjars/**
      - /favicon.ico
      - /v3/api-docs
      - /v3/api-docs/**
      - /actuator/**
      - /booking-api/room/all
      - /booking-api/room/{roomId}
      - /booking-api/room/{roomId}/{photoId}
      - /booking-api/hotels/**
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
  jwt:
    expiration: ${JWT_EXPIRATION}
    secret: ${JWT_SECRET}
  cloud:
    config:
      uri: http://localhost:8888
resilience4j:
  circuitbreaker:
    instances:
      apiGatewayCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
