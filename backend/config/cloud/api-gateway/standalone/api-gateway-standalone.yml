spring:
  kafka:
    bootstrap-servers: localhost:9093
  data:
    redis:
      host: localhost
      port: 6379
      password: sldgfhergu
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth-api/**
              filters:
                - StripPrefix=1

            - id: user-service
              uri: http://localhost:8090
              predicates:
                - Path=/user-api/**
              filters:
                - StripPrefix=1

            - id: booking-service
              uri: http://localhost:8083
              predicates:
                - Path=/booking-api/**
              filters:
                - StripPrefix=1

            - id: payment-service
              uri: http://localhost:8085
              predicates:
                - Path=/payment-api/**
              filters:
                - StripPrefix=1

            - id: notification-service
              uri: http://localhost:8082
              predicates:
                - Path=/notification-api/**
              filters:
                - StripPrefix=1

            - id: auth-service-docs
              uri: http://localhost:8081
              predicates:
                - Path=/v3/api-docs/auth-service
              filters:
                - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

            - id: user-service-docs
              uri: http://localhost:8090
              predicates:
                - Path=/v3/api-docs/user-service
              filters:
                - RewritePath=/v3/api-docs/user-service, /v3/api-docs

            - id: booking-service-docs
              uri: http://localhost:8083
              predicates:
                - Path=/v3/api-docs/booking-service
              filters:
                - RewritePath=/v3/api-docs/booking-service, /v3/api-docs

            - id: notification-service-docs
              uri: http://localhost:8082
              predicates:
                - Path=/v3/api-docs/notification-service
              filters:
                - RewritePath=/v3/api-docs/notification-service, /v3/api-docs

            - id: payment-service-docs
              uri: http://localhost:8085
              predicates:
                - Path=/v3/api-docs/payment-service
              filters:
                - RewritePath=/v3/api-docs/payment-service, /v3/api-docs

eureka:
  client:
    enabled: false

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /v3/api-docs/auth-service
      - name: user-service
        url: /v3/api-docs/user-service
      - name: booking-service
        url: /v3/api-docs/booking-service
      - name: notification-service
        url: /v3/api-docs/notification-service
      - name: payment-service
        url: /v3/api-docs/payment-service
  api-docs:
    enabled: true
security:
  paths:
    authenticated-paths:
      - /auth-api/auth/logout
    permit-all-paths:
      - /auth-api/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /webjars/**
      - /favicon.ico
      - /v3/api-docs
      - /v3/api-docs/**
      - /actuator/**
      - /booking-api/room/all
      - /booking-api/room/{roomId}
      - /booking-api/room/{roomId}/{photoId}
      - /booking-api/hotels/**
  cors:
    allowed-origins:
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
