spring:
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

eureka:
  client:
    service-url:
      defaultZone: ${SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_USER}
  secret-key: ${MINIO_PASSWORD}
  hotels-bucket: ${HOTELS_BUCKET}
  public-url: ${MINIO_PUBLIC_URL}
  rooms-bucket: ${ROOMS_BUCKET}

app:
  swagger:
    local-url: http://booking-service:8083/booking-api

springdoc:
  api-docs:
    enabled: false
staynova:
  filters:
    role-header: true
roles:
  admin-role: ${ADMIN_ROLE}
  user-role: ${USER_ROLE}
