spring:
  mail:
    test-connection: false
  kafka:
    bootstrap-servers: localhost:9093
  datasource:
    url: jdbc:h2:mem:notification_db
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

eureka:
  client:
    enabled: false

staynova:
  filters:
    role-header: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

app:
  swagger:
    local-url: http://localhost:8082/notification-api
