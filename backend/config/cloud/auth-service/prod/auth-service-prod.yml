spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}

jwt:
  expiration: ${JWT_EXPIRATION}
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

clients:
  user-service:
    url: ${SPRING_USER_SERVICE_URL}
staynova:
  filters:
    role-header: true
springdoc:
  api-docs:
    enabled: false
app:
  swagger:
    local-url: http://auth-service:8081/auth-api
