spring:
  application:
    name: auth-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

jwt:
  expiration: ${JWT_EXPIRATION:3h}
  secret: ${JWT_SECRET:changeme}

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8084/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

clients:
  user-service:
    url: ${SPRING_USER_SERVICE_URL:http://user-service:8090}

app:
  swagger:
    local-url: ${SWAGGER_LOCAL_URL:http://localhost:8089/auth-api}
